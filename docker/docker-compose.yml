# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: sports_db
    environment:
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      POSTGRES_DB: sports
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    container_name: sports_web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sports:sports@db:5432/sports
      NUXT_PUBLIC_SUPABASE_URL: http://localhost:54321   # if using full local Supabase
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ...
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.nuxt

volumes:
  postgres_data: